<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>考勤 · 老师版</title>
<meta name="description" content="课堂考勤老师端网页版：点名、记录、统计、导出，数据只保存在本机浏览器。">
<meta name="theme-color" content="#1E6FD9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="考勤老师版">
<style>
  :root{
    --blue:#1E6FD9; --blue-dark:#1a5fb8; --ink:#14202e; --muted:#5d6b7a;
    --line:#e2e8f0; --bg:#f5f7fb; --card:#fff; --danger:#c62828;
    --ok:#1b7f3b; --warn:#c77700; --purple:#7b3bb5;
    --tab-h:calc(58px + env(safe-area-inset-bottom));
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button,input,select,textarea{font-family:inherit}
  #app{padding:calc(env(safe-area-inset-top) + 8px) 12px calc(var(--tab-h) + 16px); max-width:720px; margin:0 auto}
  .topbar{display:flex;align-items:center;gap:8px;padding:4px 2px 10px}
  .topbar h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.2px}
  .topbar .grow{flex:1}
  .topbar .sub{font-size:12px;color:var(--muted);font-weight:500}
  .iconbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--card);
    color:var(--muted);font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
  .card{background:var(--card);border-radius:16px;padding:14px;
    box-shadow:0 1px 2px rgba(16,32,48,.05),0 8px 24px rgba(16,32,48,.06);margin-bottom:12px}
  .card h2{font-size:14px;margin:0 0 10px;font-weight:650}
  .row{display:flex;gap:8px;align-items:center}
  .row.wrap{flex-wrap:wrap}
  .grow{flex:1;min-width:0}
  .muted{color:var(--muted)}
  .small{font-size:12px}
  .tiny{font-size:11px}
  label.f{display:block;font-size:12px;color:var(--muted);margin:0 0 5px}
  select,input[type=text],input[type=date],input[type=time],input[type=number],textarea{
    width:100%;padding:11px 12px;font-size:15px;border-radius:11px;border:1.5px solid var(--line);
    background:var(--card);color:var(--ink);appearance:none}
  select{background-image:none}
  textarea{resize:vertical;min-height:64px;font-size:14px}
  select:focus,input:focus,textarea:focus{outline:none;border-color:var(--blue)}
  button.btn{border:0;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:600;cursor:pointer;
    background:var(--blue);color:#fff;width:100%}
  button.btn:active{background:var(--blue-dark)}
  button.btn.ghost{background:var(--card);color:var(--blue);border:1.5px solid #d6e3f7}
  button.btn.danger{background:var(--danger)}
  button.btn.sm{padding:8px 12px;font-size:13px;width:auto}
  button.btn:disabled{opacity:.5}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;
    font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
  .chip.on{color:#fff;border-color:transparent}
  .chip.on[data-s=PRESENT]{background:var(--ok)}
  .chip.on[data-s=ABSENT]{background:var(--danger)}
  .chip.on[data-s=LATE]{background:var(--warn)}
  .chip.on[data-s=EARLY_LEAVE]{background:var(--purple)}
  .chip.on[data-s=SICK_LEAVE],.chip.on[data-s=PERSONAL_LEAVE],.chip.on[data-s=PUBLIC_LEAVE]{background:var(--blue)}
  .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600}
  .badge.PRESENT{background:#e8f6ec;color:var(--ok)}
  .badge.ABSENT{background:#fdeaea;color:var(--danger)}
  .badge.LATE{background:#fff3e0;color:var(--warn)}
  .badge.EARLY_LEAVE{background:#f3e9fb;color:var(--purple)}
  .badge.LEAVE{background:#e8f0fd;color:var(--blue)}
  .list{display:flex;flex-direction:column;gap:8px}
  .item{background:var(--card);border-radius:14px;padding:12px 13px;box-shadow:0 1px 2px rgba(16,32,48,.05);cursor:pointer}
  .item .t{font-weight:650;font-size:15px}
  .item .m{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
  .item .b{margin-top:8px}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:28px 10px;line-height:1.7}
  .tabs{position:fixed;left:0;right:0;bottom:0;height:var(--tab-h);display:flex;background:var(--card);
    border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
  .tabs button{flex:1;border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:600;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:0}
  .tabs button .ic{font-size:18px;line-height:1}
  .tabs button.on{color:var(--blue)}
  .sheet-mask{position:fixed;inset:0;background:rgba(12,22,34,.45);display:none;align-items:flex-end;justify-content:center;z-index:30}
  .sheet-mask.show{display:flex}
  .sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;
    animation:up .16s ease-out}
  @keyframes up{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
  .sheet h3{font-size:16px;margin:0 0 12px}
  .sheet .f{margin-bottom:10px}
  .sheet .actions{display:flex;gap:8px;margin-top:14px}
  .sheet .actions button{flex:1}
  .toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + 16px);transform:translateX(-50%);
    background:rgba(20,32,46,.92);color:#fff;font-size:13px;padding:9px 16px;border-radius:999px;z-index:40;
    max-width:86vw;text-align:center;animation:up .15s ease-out}
  .scanbox{position:relative;width:100%;max-width:340px;aspect-ratio:1;background:#000;border-radius:16px;
    overflow:hidden;margin:6px auto 10px}
  .scanbox video,.scanbox canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .scanbox .frame{position:absolute;inset:16%;border:2px solid rgba(255,255,255,.85);border-radius:12px}
  .seg{display:flex;background:var(--bg);border-radius:11px;padding:3px;gap:3px}
  .seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:7px 4px;font-size:13px;
    color:var(--muted);font-weight:600;cursor:pointer}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(16,32,48,.08)}
  .statline{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
  .statline:last-child{border-bottom:0}
  .k{font-weight:650}
  @media (prefers-color-scheme:dark){
    :root{--blue:#4d94ee;--blue-dark:#3d82d8;--ink:#e6edf6;--muted:#94a3b4;--line:#26313d;
      --bg:#0f151c;--card:#161e27;--danger:#ff7a72;--ok:#6fd39a;--warn:#f0b562;--purple:#c08be8}
    .badge.PRESENT{background:#12251a;color:#7fd39a}
    .badge.ABSENT{background:#2a1717;color:#ff8f87}
    .badge.LATE{background:#2a2113;color:#f0b562}
    .badge.EARLY_LEAVE{background:#22182b;color:#c08be8}
    .badge.LEAVE{background:#152133;color:#7fb0f0}
    button.btn.ghost{border-color:#2a3a4c}
    .chip.on[data-s=PRESENT]{background:#1b7f3b}
    .chip.on[data-s=ABSENT]{background:#a83232}
    .chip.on[data-s=LATE]{background:#a06500}
    .chip.on[data-s=EARLY_LEAVE]{background:#6a3aa0}
  }
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" id="tabs">
  <button data-tab="rollcall"><span class="ic">✓</span>点名</button>
  <button data-tab="records"><span class="ic">☰</span>记录</button>
  <button data-tab="stats"><span class="ic">▤</span>统计</button>
  <button data-tab="manage"><span class="ic">⚙</span>管理</button>
  <button data-tab="settings"><span class="ic">⋯</span>设置</button>
</nav>
<div class="sheet-mask" id="mask"><div class="sheet" id="sheet"></div></div>
<script src="../vendor/jsQR.js"></script>
<script src="../qr-payload.js"></script>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
