<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>考勤 · 网页版（地址已更新）</title>
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=../web/">
<link rel="canonical" href="../web/">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#f5f7fb;color:#14202e;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  .box{text-align:center;padding:28px 22px;max-width:420px}
  h1{font-size:17px;margin:0 0 10px}
  p{font-size:13px;color:#5d6b7a;line-height:1.8;margin:0 0 16px}
  a{display:inline-block;padding:11px 18px;border-radius:12px;background:#1E6FD9;color:#fff;
    text-decoration:none;font-size:15px;font-weight:600}
</style>
</head>
<body>
<div class="box">
  <h1>地址已更新</h1>
  <p>“考勤 · 网页版”已移到新地址，正在自动跳转。<br>之前的数据仍保存在本机浏览器里，不受影响。</p>
  <a href="../web/">前往考勤 · 网页版</a>
</div>
<script>
  // 注销旧地址注册的 Service Worker，避免旧外壳缓存继续接管这个路径
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function (list) {
      list.forEach(function (r) {
        if (r.scope.indexOf('/teacher/') >= 0) r.unregister();
      });
    }).catch(function () {});
  }
  location.replace('../web/' + (location.hash || ''));
</script>
</body>
</html>
